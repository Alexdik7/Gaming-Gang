# Baut die Android-App (APK) von Legends United und veröffentlicht sie als neues Release (app-v1.N).
# Fester Download-Link auf die neueste Version:
# https://github.com/Alexdik7/Gaming-Gang/releases/latest/download/LegendsUnited.apk
name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ['legends/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Spieldateien in die App kopieren
        working-directory: legends/app
        run: |
          rm -rf www && mkdir www
          cp -r ../index.html ../gb.css ../manifest.webmanifest ../icon-192.png ../icon-512.png ../icon-maskable-512.png ../apple-touch-icon.png ../fonts ../js www/

      - name: Capacitor-Projekt erzeugen
        working-directory: legends/app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # Eigene Icons, Startbild und Vollbild-Design
          cp -r res/* android/app/src/main/res/
          # Versionsnummer = Build-Nummer, damit Updates drüber installiert werden können
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: APK bauen
        working-directory: legends/app/android
        run: |
          # Fester Signaturschlüssel, damit Updates den Spielstand behalten
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../LegendsUnited.apk
          # Prüfen, dass wirklich mit dem festen Schlüssel signiert wurde
          WANT=$(keytool -list -v -keystore ../debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile ../LegendsUnited.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Schlüssel erwartet $WANT, APK $GOT"
          test "$WANT" = "$GOT"

      - name: Als Download veröffentlichen
        working-directory: legends/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Version 1.${GITHUB_RUN_NUMBER} vom $(date -u +%d.%m.%Y). LegendsUnited.apk herunterladen und auf dem Android-Handy öffnen. Bei der ersten Installation muss das Installieren aus dieser Quelle erlaubt werden. Updates einfach drüber installieren – der Spielstand bleibt erhalten."
          # Releases sind unveränderlich: jede Version bekommt ein eigenes Release mit der APK
          gh release create "app-v1.${GITHUB_RUN_NUMBER}" LegendsUnited.apk --title "Legends United – App 1.${GITHUB_RUN_NUMBER}" --notes "$NOTES" --latest

      - uses: actions/upload-artifact@v4
        with:
          name: LegendsUnited-apk
          path: legends/app/LegendsUnited.apk
