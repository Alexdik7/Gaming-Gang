<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>Gaming Gang</title>
<link rel="icon" href="gang-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Chakra+Petch:wght@500;700&display=swap">
<style>
:root{--bg:#08090c;--panel:#12141a;--line:#232733;--ink:#eef0f6;--mut:#8b91a3;--neon:#39ff88;--pink:#ff3db8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(60% 40% at 80% 0%,rgba(255,61,184,.12),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(57,255,136,.10),transparent 70%),var(--bg);
 color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;
 padding:calc(28px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px))}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-family:"Permanent Marker",cursive;font-weight:400;font-size:clamp(40px,10vw,64px);line-height:1;transform:rotate(-2deg)}
h1 span{color:var(--pink)}
p{margin:0;color:var(--mut)}
.games{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
a.game{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .12s,border-color .2s}
a.game:hover,a.game:focus-visible{border-color:var(--neon);transform:translateY(-2px);outline:none}
a.game img{width:72px;height:72px;border-radius:18px;flex:none}
a.game b{display:block;font-size:17px}
a.game small{color:var(--mut);font-size:13px}
.soon{display:grid;place-items:center;min-height:100px;border:1px dashed var(--line);border-radius:18px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
  <header><h1>Gaming <span>Gang</span></h1><p style="margin-top:10px">Unsere Spielesammlung. Tippe ein Spiel an und füge es über „Zum Home-Bildschirm“ als App hinzu.</p></header>
  <section class="games">
    <a class="game" href="plug52/"><img src="plug52/icon-192.png" alt=""><span><b>The Plug from 52</b><small>Street-Tycoon · Farm, Deals, Weltreich</small></span></a>
    <a class="game" href="legends/"><img src="legends/icon-192.png" alt=""><span><b>Legends United</b><small>Kreaturen-RPG im Handheld-Stil · Brutstätte &amp; Mutationen</small></span></a>
    <div class="soon">Nächstes Spiel kommt bald …</div>
  </section>
</main>
</body>
</html>
