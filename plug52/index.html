<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a08">
<meta name="description" content="The Plug from 52: fiktives Street-Tycoon-Spiel.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plug 52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}img{max-width:100%}</style>
<title>The Plug from 52</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen mobile game shell — top HUD, scrolling stage, bottom nav (left rail on desktop). Single deliberate dark street look. */
:root{
  --bg:#070a08; --bg2:#0c110e; --panel:#111814; --panel2:#17211c; --line:#24332b; --ink:#e9f3ed; --mut:#8fa197;
  --neon:#39ff88; --neon-d:#1c9c55; --pink:#ff3db8; --gold:#f5c542; --cyan:#38bdf8; --red:#ff5a5a; --soil:#2b1d14;
  --f-g:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --f:"Chakra Petch","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 85% 0%,rgba(57,255,136,.10),transparent 70%),radial-gradient(50% 35% at 0% 100%,rgba(255,61,184,.08),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.shell{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,#0b100d,#090d0b);border-bottom:1px solid var(--line)}
.lvl{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center;border:0;background:none;padding:0}
.lvl svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lvl b{font-weight:700;font-size:15px}
.logo{font-family:var(--f-g);font-size:17px;line-height:1;color:var(--neon);text-shadow:0 0 12px rgba(57,255,136,.45);white-space:nowrap;transform:rotate(-3deg)}
.logo span{color:var(--pink)}
.cur{margin-left:auto;display:flex;gap:6px;min-width:0}
.pill{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 9px 4px 6px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .ic{width:15px;height:15px}
.p-cash{color:var(--neon)} .p-coin{color:var(--gold)} .p-rep{color:var(--pink)}
.snd{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none}
@media (max-width:420px){.logo{display:none}.pill{padding:3px 7px 3px 5px;font-size:12px}.p-rep{display:none}}

main{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 30px;display:flex;flex-direction:column;gap:14px}

/* nav */
.nav{display:flex;overflow-x:auto;scrollbar-width:none;background:#090d0b;border-top:1px solid var(--line);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav::-webkit-scrollbar{display:none}
.nb{flex:1 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;color:var(--mut);font-size:9.5px;font-weight:700;letter-spacing:.08em;position:relative}
.nb .ic{width:22px;height:22px}
.nb[aria-current="true"]{color:var(--neon)}
.nb[aria-current="true"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.nb .bd{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--pink);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;letter-spacing:0}
@media (min-width:960px){
  .shell{grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .hud{grid-column:1 / 3}
  .nav{grid-row:2;grid-column:1;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:10px 8px;gap:2px}
  .nb{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:12px;border-radius:10px}
  .nb[aria-current="true"]{background:var(--panel2)}
  .nb[aria-current="true"]::before{top:20%;bottom:20%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .nb .bd{position:static;margin-left:auto}
}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
.ttl{font-family:var(--f-g);font-weight:400;font-size:26px;line-height:1.05;color:var(--ink);letter-spacing:.01em}
.ttl em{font-style:normal;color:var(--neon)}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px}
.h2::after{content:"";flex:1;height:1px;background:var(--line)}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}

/* cards & buttons */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g2{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;
  background:var(--neon);color:#04170b;box-shadow:0 0 0 0 rgba(57,255,136,0);transition:transform .08s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:not(:disabled):hover{box-shadow:0 0 18px rgba(57,255,136,.35)}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.pink{background:var(--pink);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{background:var(--panel2);color:#5d6d64;border:1px solid var(--line);cursor:not-allowed;box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.row.wrap2{flex-wrap:wrap}
.sp{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;letter-spacing:.03em;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:#1d2923;overflow:hidden}
.bar i{display:block;height:100%;background:var(--neon);border-radius:3px;box-shadow:0 0 8px rgba(57,255,136,.5)}
.bar.gold i{background:var(--gold);box-shadow:none}
.bar.pink i{background:var(--pink);box-shadow:none}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:700;color:var(--mut);font-size:13px}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--neon)}
.empty{color:var(--mut);text-align:center;padding:22px 10px;line-height:1.5}

/* avatar */
.av{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--f-g);font-size:18px;color:#0a0f0c;position:relative;overflow:hidden}
.av::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.08) 0 4px,transparent 4px 8px)}
.av.lg{width:64px;height:64px;font-size:26px;border-radius:16px}

/* HOME */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f1713,#0a0f0c);padding:16px 16px 0}
.hero .sky{display:block;width:100%;height:90px;margin-top:8px}
.tag{font-family:var(--f-g);font-size:13px;color:var(--pink);transform:rotate(-2deg);display:inline-block}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat .mut{font-size:12px}
.stat.hot{border-color:var(--neon);box-shadow:0 0 0 1px rgba(57,255,136,.25) inset}
.event{border-radius:16px;padding:14px;background:linear-gradient(110deg,rgba(255,61,184,.18),rgba(56,189,248,.10));border:1px solid rgba(255,61,184,.45)}
.mis{display:flex;flex-direction:column;gap:10px}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.mi .bar{grid-column:1}
.coach{display:flex;gap:12px;align-items:center;border:1px dashed var(--neon);background:rgba(57,255,136,.06);border-radius:14px;padding:10px 12px}
.coach p{margin:0;line-height:1.4;font-size:13px;min-width:0}
.login{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ld{flex:1 0 54px;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;background:var(--panel2)}
.ld b{display:block;font-size:13px;margin-top:2px}
.ld.now{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.25)}
.ld.done{opacity:.45}

/* FARM */
.farmbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scene-wrap{border-radius:18px;border:1px solid var(--line);overflow:auto;background:#0b120e;max-height:none;touch-action:pan-x pan-y}
.scene{position:relative;min-width:320px;padding:14px;display:flex;flex-direction:column;gap:14px;transform-origin:0 0;
  background:
   radial-gradient(circle at 20% 10%,rgba(57,255,136,.07),transparent 40%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 28px),
   repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 28px),#0d1611}
.blds{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.bld{flex:none;width:96px;border:0;background:none;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bld .house{width:88px;height:64px;position:relative;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#1d2722,#141c18);border:1px solid #2e3d35;overflow:hidden}
.bld .house::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(90deg,#2b3a32 0 8px,#24312a 8px 16px)}
.bld .sign{position:absolute;left:8px;right:8px;top:16px;font-family:var(--f-g);font-size:11px;line-height:1.1;text-shadow:0 0 8px currentColor}
.bld .door{position:absolute;bottom:0;left:50%;width:22px;height:20px;margin-left:-11px;background:#0a0f0c;border:1px solid #2e3d35;border-bottom:0}
.bld small{font-size:10.5px;color:var(--mut);font-weight:600}
.bld .ping{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.field{position:relative;border-radius:12px;padding:12px;background:#1a130d;border:3px solid #3b2a1c;
  box-shadow:inset 0 0 0 2px #120c08;display:grid;grid-template-columns:repeat(4,minmax(64px,1fr));gap:9px}
@media (min-width:600px){.field{grid-template-columns:repeat(6,minmax(70px,1fr))}}
.plot{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:10px;padding:0;overflow:hidden;
  background:repeating-linear-gradient(0deg,#3a2718 0 6px,#33221a 6px 12px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.plot .pl{position:absolute;inset:4% 8% 18%;width:84%;height:78%}
.pg{transform-origin:50px 92px;transform:scale(calc(.22 + .78 * var(--g,1)));transition:transform 1s linear}
.plot.ready{box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 0 0 2px var(--neon),0 0 16px rgba(57,255,136,.45)}
.plot.ready .pl{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.plot .lab{position:absolute;left:0;right:0;bottom:0;padding:3px 4px 4px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:10px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.plot .lab .bar{height:3px;margin-top:2px}
.plot.empty .lab{color:var(--mut)}
.plot.empty::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:rgba(255,255,255,.18);font-weight:300}
.plot.ready .lab{color:var(--neon)}
.plot.lock{background:repeating-linear-gradient(45deg,#15110d 0 8px,#1b1510 8px 16px);border:1px dashed #4a3b2c;display:grid;place-items:center;text-align:center;font-size:10.5px;color:var(--mut);padding:4px}
.plot.lock b{display:block;color:var(--gold);font-size:12px}
.decos{display:flex;gap:10px;flex-wrap:wrap;min-height:20px}
.deco{width:56px;height:56px}
.road{position:relative;height:46px;border-radius:8px;background:#151a17;overflow:hidden;border-top:2px solid #232b26;border-bottom:2px solid #232b26}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,transparent 18px 36px);opacity:.55}
.car{position:absolute;top:6px;left:-90px;width:78px;height:34px;animation:drive 11s linear infinite}
@keyframes drive{to{left:calc(100% + 20px)}}
.crew{position:absolute;bottom:-2px;width:18px;height:28px;animation:walk 16s linear infinite}
@keyframes walk{0%{left:6%}50%{left:88%}50.01%{left:88%;transform:scaleX(-1)}100%{left:6%;transform:scaleX(-1)}}
.zoom{display:flex;gap:4px;margin-left:auto}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.li .mid{flex:1;min-width:0}
.li .nm{font-weight:700;font-size:14px;line-height:1.25}
.li .ds{font-size:12px;color:var(--mut);line-height:1.35}
.list{display:flex;flex-direction:column;gap:8px}
.sw{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;background:#0e1511;border:1px solid var(--line)}
.sw svg{width:34px;height:34px}
.q0{color:#a8b3ad}.q1{color:var(--neon)}.q2{color:var(--cyan)}.q3{color:#c084fc}.q4{color:var(--gold)}

/* orders */
.order{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.order.ok{border-color:rgba(57,255,136,.6)}
.order.partner::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--gold),var(--pink))}
.need{display:flex;flex-wrap:wrap;gap:6px}
.nd{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 5px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600}
.nd svg{width:24px;height:24px}
.nd.have{border-color:rgba(57,255,136,.55)}
.nd .cnt{font-variant-numeric:tabular-nums}
.rew{display:flex;gap:10px;flex-wrap:wrap;font-weight:700;font-size:13px;align-items:center}
.timer{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.trend-up{color:var(--neon)}.trend-dn{color:var(--red)}

/* map */
.map{width:100%;height:auto;display:block;border-radius:16px;border:1px solid var(--line);background:#0a100d}
.map .node{cursor:pointer}
.map text{font-family:var(--f);font-weight:700}

/* collection */
.coll{display:grid;grid-template-columns:minmax(90px,1.4fr) repeat(5,minmax(28px,1fr));gap:4px;font-size:11px;align-items:center}
.coll .c{height:26px;border-radius:6px;background:#0e1511;border:1px solid var(--line);display:grid;place-items:center}
.coll .c.on{background:currentColor}
.coll .c.on::after{content:"";width:8px;height:8px;border-radius:50%;background:#0a0f0c}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(2,5,3,.7);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:560px;max-height:86%;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line)}}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.x{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.say{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px;line-height:1.5}
.big{font-family:var(--f-g);font-size:40px;color:var(--gold);text-align:center;text-shadow:0 0 18px rgba(245,197,66,.45)}
.boxart{width:120px;height:120px;margin:0 auto;display:block}
.boxart.shake{animation:shake .5s ease-in-out 2}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);opacity:0;z-index:60;pointer-events:none;
  background:#0f1612;border:1px solid var(--neon);color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:600;font-size:13px;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 0 20px rgba(57,255,136,.25);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--red);box-shadow:0 0 20px rgba(255,90,90,.25)}
.fx{position:fixed;z-index:55;pointer-events:none;font-weight:700;font-size:15px;color:var(--neon);text-shadow:0 0 8px rgba(57,255,136,.6);animation:fx 1s ease-out forwards}
@keyframes fx{to{transform:translateY(-50px);opacity:0}}
input.name{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-weight:700;font-size:16px;padding:8px 10px;width:100%;max-width:260px}
.danger{background:var(--red)!important;color:#fff!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
<style>
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
 background:radial-gradient(70% 50% at 50% 35%,rgba(57,255,136,.16),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(255,61,184,.14),transparent 70%),#070a08;transition:opacity .5s}
#boot.out{opacity:0;pointer-events:none}
#boot .bl{width:140px;height:140px;filter:drop-shadow(0 0 22px rgba(57,255,136,.55));animation:bpulse 2.2s ease-in-out infinite}
@keyframes bpulse{50%{transform:scale(1.05) rotate(-2deg)}}
#boot h1{margin:0;font-family:var(--f-g);font-weight:400;font-size:40px;line-height:.95;text-align:center;color:var(--neon);text-shadow:0 0 18px rgba(57,255,136,.5);transform:rotate(-3deg)}
#boot h1 span{display:block;color:var(--pink);font-size:30px;text-shadow:0 0 18px rgba(255,61,184,.5)}

function h32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function nf(n){n=Math.floor(n);if(n<1e4)return n.toLocaleString('de-DE');for(const [v,s] of [[1e12,'T'],[1e9,'Mrd'],[1e6,'M'],[1e3,'K']])if(n>=v){const x=n/v;return x.toLocaleString('de-DE',{maximumFractionDigits:x<100?1:0})+s}}
const money=n=>'$'+nf(n);
function tf(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;if(h>=48)return Math.floor(h/24)+'T '+(h%24)+'h';return h?h+'h '+String(m).padStart(2,'0')+'m':m?m+'m '+String(s).padStart(2,'0')+'s':s+'s'}

function dayKey(t){const d=new Date(t||now());return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function weekIdx(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return Math.round(d.getTime()/864e5/7)}
function weekEnd(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+(7-((d.getDay()+6)%7)));return d.getTime()}

function availStrains(){return ST.filter(s=>s.lvl<=S.lvl)}
function genOrder(){
 const R=RI[S.region],fx=R.fx,av=availStrains();
 let partner=null;const pc=CT.find(c=>c.r===S.region);
 if(pc&&trustLvl(pc.id)>=1&&rnd()<.16)partner=pc;
 let cid,type;
 if(partner){cid='c:'+partner.id;type=5}else{
  let pool=Object.values(CUST).filter(c=>c.r===S.region&&CTYPE[c.t].lvl<=S.lvl);
  if(fx.col)pool=pool.concat(pool.filter(c=>c.t===4));
  const c=pick(pool);cid=c.id;type=c.t}
 const lines=Math.min(4,(type<=1?ri(1,2):ri(1,3))+(fx.lines||0));
 const items=[];const used={};
 for(let i=0;i<lines;i++){
  let cand=av.filter(s=>!used[s.id]);if(!cand.length)break;
  let s;if(rnd()<.45){const f=cand.filter(x=>R.fav.includes(x.id));s=f.length?pick(f):pick(cand)}
  else if(type===4){const hi=cand.slice(-4);s=pick(hi)}else{const w=cand.map((x,j)=>j+1);let r=rnd()*w.reduce((a,c)=>a+c,0);s=cand.find((x,j)=>(r-=w[j])<=0)||cand[0]}
  used[s.id]=1;
  let q=[0,0,ri(0,1),ri(1,2),ri(2,3),ri(0,2)][type];if(fx.qb&&rnd()<.35)q++;q=Math.max(q,fx.minq||0);
  q=Math.min(q,1+Math.floor(S.eb.qc/2),4);
  let n=Math.max(1,Math.round((ri(2,6)-s.idx*.3)*(fx.qm||1)));if(q>=2)n=Math.max(1,Math.ceil(n/2));
  const prods=PB.filter(p=>S.pb[p.id]>0&&q>=p.rec.minq);
  if(prods.length&&rnd()<.3&&type>=1){const p=pick(prods);items.push({k:'p',rec:p.id,s:s.id,q,n:Math.max(1,Math.ceil(n/2))})}
  else items.push({k:'b',s:s.id,q,n});
 }
 let v=items.reduce((a,it)=>a+itemVal(it.k==='b'?'b:'+it.s+':'+it.q:'p:'+it.rec+':'+it.s+':'+it.q)*it.n,0);
 v*=CTYPE[type].m*R.pm*(fx.rw||1)*(items.some(it=>it.s===eventStrain().id)?1.25:1);
 const dur=(type===5?14:ri(22,48))*60e3*(fx.tm||1);
 return{id:S.oseq++,cid,type,items,cash:Math.round(v),xp:Math.round(Math.pow(v,.72)*.55)+4,rep:CTYPE[type].rep*(fx.rep||1),
  coins:type>=3?ri(1,3):(rnd()<.06?1:0),exp:now()+dur,r:S.region}}
function custOf(o){if(o.cid.startsWith('c:')){const c=CI[o.cid.slice(2)];return{n:c.n,col:c.col,p:c.role,contact:c}}return CUST[o.cid]}
function stacksFor(it){return Object.keys(S.inv).filter(k=>{const o=parseK(k);return o.k===it.k&&o.s===it.s&&o.q>=it.q&&(it.k==='b'||o.rec===it.rec)}).sort((a,b)=>parseK(a).q-parseK(b).q)}
function haveFor(it){return stacksFor(it).reduce((a,k)=>a+S.inv[k],0)}
function canFill(o){return o.items.every(it=>haveFor(it)>=it.n)}
function fillOrder(id,ev){const o=S.orders.find(x=>x.id===id);if(!o)return;if(!canFill(o)){toast('Dir fehlen noch Waren für diesen Auftrag.',1);sfx('err');return}
 o.items.forEach(it=>{let need=it.n;for(const k of stacksFor(it)){const t=Math.min(need,S.inv[k]);addInv(k,-t);need-=t;if(!need)break}});
 const cs=S.cust[o.cid]||(S.cust[o.cid]={sat:60,n:0});
 let mult=1+.05*S.eb.garage+(hasPerk('viktor')?.1:0)+(cs.sat>=85?.1:0);const rc=CT.find(c=>c.r===o.r);
 if(rc&&trustLvl(rc.id)>=2)mult+=.05;if(CT.some(c=>trustLvl(c.id)>=5))mult+=.05;if(o.type===4&&hasPerk('niran'))mult+=.2;
 const cash=Math.round(o.cash*mult);gainCash(cash);
 let rep=o.rep;if(hasPerk('mira'))rep=Math.round(rep*1.25);S.rep+=rep;

 if(rc)S.trust[rc.id]=(S.trust[rc.id]||0)+(o.type===5?25:10);

 if(S.rOrders[o.r]===10&&!S.rare.includes(o.r)){S.rare.push(o.r);S.coins+=5;setTimeout(()=>toast('Sammlerstück erhalten: '+RI[o.r].rare+' (+5 Coins)'),900)}

 sfx('cash');fxAt(ev,'+'+money(cash));toast('Deal abgeschlossen: +'+money(cash)+(coins?' · +'+coins+' Coins':'')+' · +'+rep+' Rep');checkAll();save();render()}
function tickOrders(){const t=now();let ch=false;
 S.orders=S.orders.filter(o=>{if(o.exp<=t){const cs=S.cust[o.cid]||(S.cust[o.cid]={sat:60,n:0});cs.sat=Math.max(0,cs.sat-15);ch=true;return false}return true});

function tone(f,d,type,v,w,f2){const a=ac();if(!a)return;const t=a.currentTime+(w||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,w,hp){const a=ac();if(!a||!noiseBuf)return;const t=a.currentTime+(w||0),s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||6000;s.buffer=noiseBuf;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d)}
function sfx(k){if(!S||!S.snd)return;
 if(k==='tap')tone(520,.06,'triangle',.05);
 else if(k==='plant')tone(300,.12,'sine',.08,0,520);
 else if(k==='harvest'){tone(660,.08,'triangle',.06);tone(880,.1,'triangle',.06,.07);tone(1175,.14,'triangle',.05,.14)}
 else if(k==='cash'){tone(988,.07,'square',.035);tone(1319,.16,'square',.035,.07);noise(.08,.05,0,8000)}
 else if(k==='err')tone(150,.18,'sawtooth',.05,0,100);
 else if(k==='lvl'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.06,i*.09))}
 else if(k==='box'){tone(200,.4,'sawtooth',.03,0,900);noise(.3,.05,.3,3000)}}
const PROG=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];const mtof=m=>440*Math.pow(2,(m-69)/12);
function musTick(){if(!S.mus)return;const a=ac();if(!a)return;const s=step%16,bar=Math.floor(step/16)%4,ch=PROG[bar];
 if(s===0||s===10)tone(110,.25,'sine',.22,0,40);
 if(s===4||s===12)noise(.12,.06,0,1800);
 if(s%2===0)noise(.03,.025,0,9000);
 if(s===0||s===6||s===8)tone(mtof(ch[0]-24),.28,'triangle',.08);
 if(s===0)ch.forEach(n=>tone(mtof(n),1.6,'sine',.018));
 if(s===14&&rnd()<.5)tone(mtof(ch[2]+12),.2,'sine',.02);
 step++}
function setMusic(on){clearInterval(musT);musT=null;if(on){ac();musT=setInterval(musTick,60000/86/4)}}

function seedSheet(i){const all=i<0;const free=S.plots.filter(p=>!p.s).length;
 sheet(sh(all?'Alle freien Felder':'Sorte wählen',all?free+' Felder · Kosten pro Feld':'Samen kosten Cash. Höhere Qualität ist Glückssache.')+'<div class="list">'+ST.map(s=>{const lk=s.lvl>S.lvl,c=all?s.seed*free:s.seed;
  return '<div class="li" style="'+(lk?'opacity:.5':'')+'"><div class="sw">'+budSVG(s,0)+'</div><div class="mid"><div class="nm">'+s.n+' <span class="chip" style="color:'+RARC[s.rar]+'">'+RARN[s.rar]+'</span></div><div class="ds">'+ic('clock')+' '+tf(growTime(s))+' · Wert '+money(s.val)+(s.id===eventStrain().id?' · <span style="color:var(--pink)">Event</span>':'')+'</div></div>'+
  (lk?'<span class="chip" style="color:var(--mut)">'+ic('lock')+' L'+s.lvl+'</span>':'<button class="btn sm" data-a="plant" data-s="'+s.id+'" data-i="'+i+'" '+(S.cash<c?'disabled':'')+'>'+money(c)+'</button>')+'</div>'}).join('')+'</div>')}
function plotSheet(i){const p=S.plots[i],st=SI[p.s],c=speedCost(p.r);
 sheet(sh(st.n,'Wächst · fertig in <span data-t="'+p.r+'"></span>')+'<div class="bar"><i data-s="'+p.p+'" data-r="'+p.r+'"></i></div><p class="sub" style="margin:0">'+st.d+'</p><button class="btn gold" data-a="speedPlot" data-i="'+i+'" '+(S.coins<c?'disabled':'')+'>'+ic('zap')+' Sofort fertig · '+c+' Coins</button>')}
function speedCost(r){return Math.max(1,Math.ceil((r-now())/1000/600))}
function prodSheet(id){const p=PI[id];const ks=Object.keys(S.inv).filter(k=>{const o=parseK(k);return o.k==='b'&&o.q>=p.rec.minq&&S.inv[k]>=p.rec.in}).sort((a,b)=>itemVal(b)-itemVal(a));
 sheet(sh(p.rec.n,p.rec.in+' Buds derselben Sorte und Qualität → 1 '+p.rec.n)+(ks.length?'<div class="list">'+ks.map(k=>{const o=parseK(k),st=SI[o.s];const out='p:'+id+':'+o.s+':'+o.q;
  return '<div class="li"><div class="sw">'+budSVG(st,o.q)+'</div><div class="mid"><div class="nm">'+st.n+'</div><div class="ds"><span class="q'+o.q+'">'+QN[o.q]+'</span> · Bestand '+S.inv[k]+' · '+tf(pbTime(p,o.s))+' · Wert '+money(itemVal(out))+'</div></div><button class="btn sm" data-a="startProd" data-id="'+id+'" data-k="'+k+'">Start</button></div>'}).join('')+'</div>':'<div class="empty">Du brauchst mindestens '+p.rec.in+' gleiche Buds'+(p.rec.minq?' in '+QN[p.rec.minq]+' oder besser':'')+'. Ernte mehr auf der Farm.</div>'))}
function regionSheet(id){const r=RI[id],on=S.regions.includes(id),c=CT.find(x=>x.r===id);
 sheet('<div style="border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b120e">'+skyline(r.col,r.id,110)+'</div>'+sh(r.n,r.c+' · '+r.tag)+
 '<div class="list" style="gap:6px"><div class="row"><span class="mut">Preisniveau</span><b class="sp">×'+r.pm+'</b></div><div class="row"><span class="mut">Lieblingssorten</span><b class="sp" style="text-align:right">'+r.fav.map(f=>SI[f].n).join(', ')+'</b></div><div class="row"><span class="mut">Kontakt</span><b class="sp">'+(on?esc(c.n):'???')+'</b></div><div class="row"><span class="mut">Sammlerstück</span><b class="sp">'+(S.rare.includes(id)?r.rare:'???')+'</b></div></div>'+
 '<div class="say"><b style="color:'+r.col+'">Besonderheit:</b> '+r.ch+'</div>'+
 (on?(S.region===id?'<span class="chip" style="color:var(--neon);align-self:flex-start">'+ic('pin')+' Du bist hier</span>':'<button class="btn" data-a="travel" data-id="'+id+'">'+ic('pin')+' Hierher wechseln</button><p class="sub" style="margin:0">Beim Wechsel bleiben deine offenen Aufträge erhalten. Neue Aufträge kommen aus der aktiven Region.</p>')
  :S.lvl<r.lvl?'<button class="btn" disabled>'+ic('lock')+' Ab Level '+r.lvl+'</button>':'<button class="btn gold" data-a="unlockRegion" data-id="'+id+'" '+(S.cash<r.cost?'disabled':'')+'>Expandieren · '+money(r.cost)+'</button>'))}
function talkSheet(id){const c=CI[id],l=trustLvl(id);sheet(sh(esc(c.n),c.role+' · '+RI[c.r].n)+'<div class="row" style="align-items:flex-start">'+avatar(c,1)+'<div class="say" style="flex:1">'+c.lines[Math.min(3,Math.floor(l*.8))]+'</div></div>'+
 (l<1?'<p class="sub" style="margin:0">Erfülle Aufträge in '+RI[c.r].n+', um Vertrauen aufzubauen. Ab Stufe 1 schickt '+c.n.split(' ')[0]+' dir eigene Partner-Aufträge.</p>':'')+'<button class="btn sec" data-a="close">Bis später</button>')}

/* ============ ACTIONS ============ */
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='toast',2400)}
function fxAt(e,txt){if(!e||e.clientX===undefined)return;const d=document.createElement('div');d.className='fx';d.textContent=txt;d.style.left=(e.clientX-20)+'px';d.style.top=(e.clientY-20)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function plantAt(i,sid){const s=SI[sid],t=now();if(S.cash<s.seed)return false;S.cash-=s.seed;S.plots[i]={s:sid,p:t,r:t+growTime(s)*1000};S.st.plant++;return true}
function harvestAt(i){const p=S.plots[i];if(!p.s||p.r>now())return 0;const st=SI[p.s],n=yieldN();if(used()+n>cap())return -1;
 for(let k=0;k<n;k++){const q=rollQ(st);addInv('b:'+st.id+':'+q,1);if(q===4)S.st.ultra++;
  if(!S.coll[st.id+':'+q]){S.coll[st.id+':'+q]=1;if(q>=2)setTimeout(()=>toast('Neu in der Sammlung: '+st.n+' · '+QN[q]),300);if(QN.every((_,j)=>S.coll[st.id+':'+j])){S.coins+=10;setTimeout(()=>toast('Sammlung komplett: '+st.n+' (+10 Coins)'),700)}}}
 S.st.harvest+=n;addXP(1+Math.round(st.val/12)*n/2);S.plots[i]={s:null};return n}
function claimLogin(){if(S.daily.claimed)return;const r=LOGIN[(S.daily.streak-1)%7];S.daily.claimed=true;
 if(r.cash)S.cash+=Math.round(r.cash*(1+S.lvl*.3));if(r.coins)S.coins+=r.coins;if(r.box)S.boxes+=r.box;sfx('cash');toast('Login-Belohnung erhalten!')}
function openBox(){if(!S.boxes)return;S.boxes--;S.st.boxes++;sfx('box');const av=availStrains(),r=rnd();let txt,sub='';
 if(r<.35){const st=pick(av.slice(-3)),q=ri(1,3),n=ri(2,4);addInv('b:'+st.id+':'+q,n);S.coll[st.id+':'+q]=1;txt=n+'× '+st.n;sub=QN[q]}
 else if(r<.6){const c=Math.round(200*Math.pow(S.lvl,1.45));S.cash+=c;txt=money(c);sub='Cash'}
 else if(r<.82){const c=ri(3,10);S.coins+=c;txt=c+' Coins';sub='Empire Coins'}
 else{S.boost=Math.max(S.boost,now())+30*60e3;txt='Grow-Boost';sub='30 Minuten doppelt so schnelles Wachstum'}
 sheet('<svg class="boxart shake" viewBox="0 0 100 100">'+boxArt()+'</svg><div class="big" style="font-size:30px">'+txt+'</div><p class="mut" style="text-align:center;margin:0">'+sub+'</p><button class="btn" data-a="close">Nice</button>'+(S.boxes?'<button class="btn pink" data-a="openBox">Nächste öffnen ('+S.boxes+')</button>':''));checkAll()}
const A={
 go:d=>{view=d.v;closeSheet();$('main').scrollTop=0;render()},
 close:()=>{closeSheet();render()},
 subM:d=>{subM=d.v;render()},subI:d=>{subI=d.v;render()},subN:d=>{subN=d.v;render()},
 skipTut:()=>{S.tut=TUT.length;render()},resetTut:()=>{S.tut=0;toast('Tutorial neu gestartet');render()},
 toggleSnd:()=>{S.snd=!S.snd;if(S.snd)ac();render()},
 toggleMus:()=>{S.mus=!S.mus;setMusic(S.mus);render()},
 zoom:d=>{S.zoom=Math.min(1.4,Math.max(.7,+(S.zoom+.15*d).toFixed(2)));render()},
 plot:(d,e)=>{const i=+d.i,p=S.plots[i];if(!p.s)return seedSheet(i);if(p.r<=now()){const n=harvestAt(i);if(n<0){toast('Lager voll. Verkaufe Waren oder baue das Lagerhaus aus.',1);sfx('err');return}sfx('harvest');fxAt(e,'+'+n+' Buds');checkAll();render();return}plotSheet(i)},
 pickSeed:d=>seedSheet(+d.i),
 plant:d=>{const i=+d.i;if(i>=0){if(!plantAt(i,d.s))return;}else{let n=0;S.plots.forEach((p,j)=>{if(!p.s&&plantAt(j,d.s))n++});toast(n+' Felder bepflanzt')}sfx('plant');closeSheet();checkAll();render()},
 harvestAll:(d,e)=>{let tot=0,full=false;S.plots.forEach((p,i)=>{const n=harvestAt(i);if(n<0)full=true;else tot+=n});if(tot){sfx('harvest');fxAt(e,'+'+tot+' Buds')}if(full)toast('Lager voll. Nicht alles konnte geerntet werden.',1);checkAll();render()},
 speedPlot:d=>{const p=S.plots[+d.i],c=speedCost(p.r);if(S.coins<c)return;S.coins-=c;p.r=now();closeSheet();sfx('tap');render()},
 expand:()=>{const n=S.plots.length;if(S.lvl<plotReq(n)){toast('Neue Anbaufläche ab Level '+plotReq(n),1);return}const c=plotCost(n);if(S.cash<c){toast('Dir fehlen '+money(c-S.cash)+'.',1);sfx('err');return}S.cash-=c;S.plots.push({s:null});sfx('cash');toast('Neue Anbaufläche!');checkAll();render()},
 buildPB:d=>{const p=PI[d.id];if(S.cash<p.cost)return;S.cash-=p.cost;S.pb[p.id]=1;S.st.upgrades++;sfx('lvl');toast(p.n+' gebaut!');checkAll();render()},
 upPB:d=>{const p=PI[d.id],c=pbCost(p);if(S.cash<c)return;S.cash-=c;S.pb[p.id]++;S.st.upgrades++;sfx('cash');toast(p.n+' auf Stufe '+S.pb[p.id]);checkAll();render()},
 pickProd:d=>prodSheet(d.id),
 startProd:d=>{const p=PI[d.id],o=parseK(d.k);if((S.inv[d.k]||0)<p.rec.in||S.jobs[p.id].length>=pbSlots(p))return;addInv(d.k,-p.rec.in);const t=now();S.jobs[p.id].push({k:'p:'+p.id+':'+o.s+':'+o.q,s:t,r:t+pbTime(p,o.s)*1000});sfx('plant');closeSheet();render()},
 collect:(d,e)=>{const j=S.jobs[d.id][+d.i];if(!j||j.r>now())return;if(used()+1>cap()){toast('Lager voll.',1);return}addInv(j.k,1);S.jobs[d.id].splice(+d.i,1);S.st.produced++;addXP(Math.round(Math.pow(itemVal(j.k),.6)*.3)+2);sfx('harvest');fxAt(e,'+1 Produkt');checkAll();render()},
 speedJob:d=>{const j=S.jobs[d.id][+d.i];if(!j)return;const c=speedCost(j.r);if(S.coins<c){toast('Nicht genug Coins ('+c+' nötig).',1);return}S.coins-=c;j.r=now();sfx('tap');render()},
 fill:(d,e)=>fillOrder(+d.id,e),
 reject:d=>{const o=S.orders.find(x=>x.id===+d.id);if(!o)return;const cs=S.cust[o.cid]||(S.cust[o.cid]={sat:60,n:0});cs.sat=Math.max(0,cs.sat-5);S.orders=S.orders.filter(x=>x!==o);S.nextOrder=now()+15000;render()},
 sell:(d,e)=>{const k=d.k;if(!S.inv[k])return;const n=d.n==='all'?S.inv[k]:1,pr=sellPrice(k)*n;addInv(k,-n);gainCash(pr);S.st.sold+=n;sfx('cash');fxAt(e,'+'+money(pr));checkAll();render()},
 talk:d=>talkSheet(d.id),
 gift:d=>{const c=CI[d.id];if(trustLvl(c.id)<3||S.gift[c.id]===dayKey())return;S.gift[c.id]=dayKey();const coins=2+trustLvl(c.id),cash=Math.round(100*Math.pow(S.lvl,1.3));S.coins+=coins;S.cash+=cash;sfx('cash');toast(c.n.split(' ')[0]+' schenkt dir '+money(cash)+' und '+coins+' Coins');render()},
 region:d=>regionSheet(d.id),
 unlockRegion:d=>{const r=RI[d.id];if(S.lvl<r.lvl||S.cash<r.cost)return;S.cash-=r.cost;S.regions.push(r.id);S.region=r.id;S.nextOrder=now()+2000;sfx('lvl');toast('Willkommen in '+r.n+'!');checkAll();closeSheet();render()},
 travel:d=>{S.region=d.id;S.nextOrder=Math.min(S.nextOrder,now()+3000);sfx('tap');toast('Aktive Region: '+RI[d.id].n);closeSheet();render()},
 upEB:d=>{const b=EB.find(x=>x.id===d.id),c=ebCost(b);if(S.cash<c||S.eb[b.id]>=ebCap(b)||S.lvl<b.req)return;S.cash-=c;S.eb[b.id]++;S.st.upgrades++;sfx('cash');toast(b.n+' auf Stufe '+S.eb[b.id]);checkAll();render()},
 buyDeco:d=>{const x=DC.find(y=>y.id===d.id);if(S.decos.includes(x.id)||S.lvl<x.lvl)return;if(x.cash){if(S.cash<x.cash)return;S.cash-=x.cash}else{if(S.coins<x.coins)return;S.coins-=x.coins}S.decos.push(x.id);S.rep+=10;sfx('lvl');toast(x.n+' steht jetzt auf deiner Farm');checkAll();render()},
 claimLogin:()=>{claimLogin();render()},
 claimM:d=>{const m=(d.k==='d'?S.daily.m:S.weekly.m)[+d.i];if(!m||m.c||mProg(m)<m.g)return;m.c=true;if(d.k==='d'){S.coins+=2;S.cash+=100*S.lvl}else{S.coins+=15;S.boxes++}sfx('cash');toast('Mission erledigt!');render()},
 buyBox:()=>{if(S.coins<8)return;S.coins-=8;S.boxes++;openBox();render()},
 openBox:()=>{openBox();render()},
 exportSave:()=>{save();const code='P52:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$('savecode');ta.value=code;
  try{navigator.clipboard.writeText(code).then(()=>toast('Code kopiert'),()=>{ta.select();toast('Code markiert. Jetzt kopieren.')})}catch(e){ta.select();toast('Code markiert. Jetzt kopieren.')}},
 importSave:()=>{const v=($('savecode').value||'').trim();try{if(!v.startsWith('P52:'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));if(!d||!d.plots||!d.st)throw 0;
  const f=fresh();S=Object.assign(f,d,{st:Object.assign(f.st,d.st),eb:Object.assign(f.eb,d.eb||{}),pb:Object.assign(f.pb,d.pb||{}),jobs:Object.assign(f.jobs,d.jobs||{})});S.mus=false;dailyCheck();save();toast('Spielstand geladen');view='home';render()}
  catch(e){toast('Dieser Code ist ungültig. Kopiere ihn bitte komplett.',1)}},
 reset:(d,e,el)=>{if(!el.classList.contains('danger')){el.classList.add('danger');el.textContent='Wirklich alles löschen? Nochmal tippen';setTimeout(()=>{if(el.isConnected){el.classList.remove('danger');el.textContent='Spielstand löschen'}},4000);return}
  S=fresh();dailyCheck();view='home';save();toast('Neuer Spielstand gestartet');render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){ac();f(el.dataset,e,el);save()}});
document.addEventListener('change',e=>{if(e.target.id==='pname'){S.name=e.target.value.trim().slice(0,18)||'Boss';save();renderHud()}});

/* ============ LOOP ============ */
function updTimers(){const t=now();document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=tf((+el.dataset.t-t)/1000)});
 document.querySelectorAll('[data-tc]').forEach(el=>{el.textContent=speedCost(+el.dataset.tc)});
 document.querySelectorAll('i[data-r]').forEach(el=>{const s=+el.dataset.s,r=+el.dataset.r;el.style.width=Math.min(100,Math.max(0,(t-s)/(r-s)*100))+'%'});
 if(view==='farm')document.querySelectorAll('.plot .pg').forEach(g=>{const b=g.closest('.plot'),p=S.plots[+b.dataset.i];if(p&&p.s&&p.r>t)g.style.setProperty('--g',Math.min(1,(t-p.p)/(p.r-p.p)).toFixed(3))})}
let lastSig='';
function sig(){const t=now();return S.plots.map(p=>p.s?(p.r<=t?'R':'G'):'E').join('')+'|'+PB.map(p=>S.jobs[p.id].map(j=>j.r<=t?1:0).join('')).join(',')+'|'+S.orders.map(o=>o.id).join(',')+'|'+(S.boost>t)+'|'+S.tut+'|'+S.daily.day}
function tick(){dailyCheck();const ch=tickOrders();checkAll();const s=sig();if(ch||s!==lastSig){lastSig=s;const sc=$('main').scrollTop;render();$('main').scrollTop=sc}else{updTimers();renderNav();renderHud()}}
function save(){if(!S)return;S.last=now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function start(data){let d=data&&data.S;if(!d){try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}}
 const f=fresh();S=d?Object.assign(f,d,{st:Object.assign(f.st,d.st||{}),eb:Object.assign(f.eb,d.eb||{}),pb:Object.assign(f.pb,d.pb||{}),jobs:Object.assign(f.jobs,d.jobs||{})}):f;
 if(!d){S.orders=[];S.nextOrder=0;S.orders.push(firstOrder());}
 dailyCheck();if(S.mus)S.mus=false;
 lastSig=sig();render();setInterval(tick,1000);setInterval(save,5000);
 addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save)}
function firstOrder(){const c=CUST['ams-0'];return{id:S.oseq++,cid:c.id,type:0,items:[{k:'b',s:'nl',q:0,n:4}],cash:90,xp:20,rep:1,coins:1,exp:now()+45*60e3,r:'ams'}}
window.claude?.hot?.snapshot?.(()=>({S:(S&&(S.last=now(),S))}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
